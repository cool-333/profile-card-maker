<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>프로필 카드 메이커</title>
    <link rel="stylesheet" href="./reset.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="outbox">
      <div class="writebox">
        <span class="preset-bts">
          <button id="bt-blue">다크 블루</button
          ><button id="bt-green">에메랄드</button
          ><button id="bt-pink">코랄 핑크</button>
        </span>
        <span class="color-container">
          <div class="inputbox point-box">
            <p>포인트/카드 테두리 색상</p>
            <span class="color-value">
              <p>RGB</p>
              <p>HSL</p>
              <p>HEX</p>
            </span>
          </div>
          <div class="inputbox back-box">전체 배경 색상</div>
        </span>
        <div class="name-mbti">
          <input
            class="inputbox name"
            maxlength="10"
            placeholder="이름을 입력하세요"
          />
          <input class="inputbox mbti" maxlength="6" placeholder="MBTI" />
        </div>
        <input
          class="inputbox in-a-word"
          maxlength="30"
          placeholder="소개 한 마디"
        />
      </div>
      <div class="preview"></div>
    </div>
  </body>
</html>
