<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>프로필 카드 메이커</title>
    <link rel="stylesheet" href="./reset.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="outbox">
      <div class="writebox">
        <span class="preset-bts">
          <button id="bt-blue">다크 블루</button
          ><button id="bt-green">에메랄드</button
          ><button id="bt-pink">코랄 핑크</button>
        </span>
        <!-- 💫 컬러 파레트에서 색상 선택 시 RGB< HSL, HEX값 출력되는 것 : 배운 후 구현 필요. 💫 -->
        <span class="color-container">
          <div class="inputbox point-box">
            <p>포인트/카드 테두리 색상</p>
            <span class="color-value">
              <p>RGB</p>
              <p>HSL</p>
              <p>HEX</p>
            </span>
          </div>
          <div class="inputbox back-box">전체 배경 색상</div>
        </span>
        <div class="name-mbti">
          <input
            class="inputbox name"
            maxlength="10"
            placeholder="이름을 입력하세요"
          />
          <input class="inputbox mbti" maxlength="6" placeholder="MBTI" />
        </div>
        <input
          class="inputbox in-a-word"
          maxlength="30"
          placeholder="소개 한 마디"
        />
        <!-- 💫 버튼 클릭 시 항목 삭제되는 기능 : 배운 후 구현 필요. 💫 -->
        <div class="hobby-content">
          <input class="inputbox hobby" maxlength="6" placeholder="항목" />
          <input
            class="inputbox hobby-text"
            maxlength="20"
            placeholder="내용"
          />
          <button class="delete">삭제</button>
        </div>
        <div class="like-content">
          <input class="inputbox like" maxlength="6" placeholder="항목" />
          <input class="inputbox like-text" maxlength="20" placeholder="내용" />
          <button class="delete">삭제</button>
        </div>
        <!-- 💫 항목 추가 기능 : 배운 후 구현 필요. 💫 -->
        <button class="add-hobby">+ 항목 추가하기</button>
        <!-- 💫 슬라이더 값을 슬라이더 수치값과 동일하게 하는 기능 : 배운 후 구현 필요. 💫 -->
        <div class="status1">
          <input class="inputbox stat1" maxlength="6" placeholder="항목" />
          <input
            class="inputbox stat1-value"
            min="0"
            max="100"
            placeholder="수치"
            type="number"
          />
          <input
            type="range"
            class="slider1"
            min="0"
            max="100"
            value="0"
            step="10"
          />
          <button class="delete">삭제</button>
        </div>

        <div class="status2">
          <input class="inputbox stat2" maxlength="6" placeholder="항목" />
          <input
            class="inputbox stat2-value"
            min="0"
            max="100"
            placeholder="수치"
            type="number"
          />
          <input
            type="range"
            class="slider1"
            min="0"
            max="100"
            value="0"
            step="10"
          />
          <button class="delete">삭제</button>
        </div>

        <div class="status3">
          <input class="inputbox stat3" maxlength="6" placeholder="항목" />
          <input
            class="inputbox stat3-value"
            min="0"
            max="100"
            placeholder="수치"
            type="number"
          />
          <input
            type="range"
            class="slider1"
            min="0"
            max="100"
            value="0"
            step="10"
          />
          <button class="delete">삭제</button>
        </div>

        <div class="status4">
          <input class="inputbox stat4" maxlength="6" placeholder="항목" />
          <input
            class="inputbox stat4-value"
            min="0"
            max="100"
            placeholder="수치"
            type="number"
          />
          <input
            type="range"
            class="slider1"
            min="0"
            max="100"
            value="0"
            step="10"
          />
          <button class="delete">삭제</button>
        </div>
        <button class="add-stat">+ 능력치 추가하기</button>
      </div>
      <div class="preview"></div>
    </div>
  </body>
</html>
